version: '3.9'

services:
  # Production service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: claude-scheduler
    ports:
      - "3000:3000"  # API server
      # Optional: If serving static files from nginx
      # - "80:80"
      # - "443:443"
    volumes:
      # Volume for persistent database
      - ./data:/app/data
      # Volume for logs
      - ./logs:/app/logs
      # Optional: SSL certificates
      # - ./certs:/app/certs:ro
    environment:
      # Production environment
      NODE_ENV: production

      # API Configuration
      API_PORT: 3000
      API_HOST: 0.0.0.0

      # Claude API Configuration
      # CLAUDE_API_KEY: ${CLAUDE_API_KEY}

      # Database
      DB_PATH: /app/data/scheduler.db

      # Logging
      LOG_LEVEL: info

      # Security
      # ALLOWED_ORIGINS: https://yourdomain.com

    # Container restart policy
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=claude-scheduler"

    # Network
    networks:
      - claude-network

    # Security context
    user: "nodejs"
    read_only_root_filesystem: false
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Optional: Nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: claude-scheduler-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - claude-network
  #   restart: unless-stopped

networks:
  claude-network:
    driver: bridge

volumes:
  data:
  logs:
