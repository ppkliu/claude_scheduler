version: '3.9'

services:
  # Production service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: llm-scheduler
    ports:
      - "3000:3000"  # API server
      # Optional: If serving static files from nginx
      # - "80:80"
      # - "443:443"
    volumes:
      # Volume for persistent database
      - ./data:/app/data
      # Volume for logs
      - ./logs:/app/logs
      # Read-only mount for plans directory
      - ${HOME}/.claude/plans:/data/plans:ro
      # Optional: SSL certificates
      # - ./certs:/app/certs:ro
    environment:
      # Production environment
      NODE_ENV: production

      # API Configuration
      API_PORT: 3000
      API_HOST: 0.0.0.0

      # LLM API Configuration
      # LLM_API_KEY: ${LLM_API_KEY}

      # Database
      DB_PATH: /app/data/scheduler.db

      # Logging
      LOG_LEVEL: info

      # Security
      # ALLOWED_ORIGINS: https://yourdomain.com

      # Plans directory (mounted from host)
      PLANS_DIR: /data/plans

      # Deployment System Configuration (Production defaults)
      # File Watcher (disabled in production)
      FILE_WATCH_ENABLED: "false"
      FILE_WATCH_MODE: "internal"
      FILE_WATCH_DEBOUNCE_MS: "2000"

      # Monitoring Panel (can be enabled with ENABLE_MONITOR=true)
      ENABLE_MONITOR: "false"
      METRICS_INTERVAL_MS: "60000"
      GIT_TRACKING_INTERVAL_MS: "300000"
      DEPENDENCY_CHECK_CRON: "0 3 * * 0"

      # Data Retention Policies
      BUILD_RETENTION_DAYS: "7"
      METRICS_RETENTION_DAYS: "3"

    # Container restart policy
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=llm-scheduler"

    # Network
    networks:
      - llm-network

    # Security context
    user: "nodejs"
    read_only_root_filesystem: false
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Optional: Nginx reverse proxy for production
  # nginx:
  #   image: nginx:alpine
  #   container_name: llm-scheduler-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - llm-network
  #   restart: unless-stopped

networks:
  llm-network:
    driver: bridge

volumes:
  data:
  logs:
